name: Release unsigned formal
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character private myelnn/recovery commit
        required: true
        type: string
      release_version:
        description: Committed application version newer than 1.5.0 (candidate mode)
        type: string
        default: 1.6.0
      unsigned_authorized:
        description: Owner explicitly authorizes formal publication without publisher signing
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: unsigned-formal-${{ inputs.release_version }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/recovery
          ref: ${{ inputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          path: src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source identity and signing guards
        working-directory: src
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          UNSIGNED_AUTHORIZED: ${{ inputs.unsigned_authorized && 'true' || 'false' }}
        run: |
          node -e "const a=require('node:assert/strict'); a.match(process.env.SOURCE_SHA,/^[a-f0-9]{40}$/); a.equal(require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_SHA)"
          node --test packaging/tests/signing-policy.test.cjs packaging/tests/verify-installers.test.cjs

          node --test packaging/tests/unsigned-release.test.cjs
          node -e "require('./packaging/unsigned-release-policy.cjs').unsignedContract(process.env.SOURCE_SHA,process.env.RELEASE_VERSION,'image',require('./windows-client/package.json').version,process.env.UNSIGNED_AUTHORIZED)"
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            builder_platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            builder_platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: mac
            builder_platform: macos
            arch: x64
          - os: windows-2022
            platform: windows
            builder_platform: windows
            arch: x64
          - os: windows-2022
            platform: windows
            builder_platform: windows
            arch: ia32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: src/windows-client
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RECOVERY_SCOPE: image
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXT4_REQUIRE_FIXTURES: ${{ matrix.platform == 'linux' && '1' || '0' }}
      UNSIGNED_AUTHORIZED: ${{ inputs.unsigned_authorized && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/recovery
          ref: ${{ inputs.source_sha }}
          path: src
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libarchive-tools rpm libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libgbm1 libasound2t64 xvfb e2fsprogs
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix native --ignore-scripts
      - run: npm run typecheck
      - run: npm run test:packaging
      - run: node scripts/build-native.cjs --arch=${{ matrix.arch }}
      - run: npm run build:main
      - name: Independent ext4 fixtures
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          fixture_manifest=$(node scripts/create-ext4-fixtures.cjs)
          test -n "$fixture_manifest" && test -f "$fixture_manifest"
          echo "EXT4_FIXTURE_MANIFEST=$fixture_manifest" >> "$GITHUB_ENV"
      - name: Recovery regression tests
        if: matrix.arch != 'ia32'
        run: npm test -- --reporter=dot
      - name: Ext4 production coverage
        if: matrix.platform == 'linux'
        run: pnpm exec vitest run src/main/__tests__/ext4.test.ts src/main/__tests__/ext4-production.test.ts --coverage --coverage.include=src/main/filesystems/ext4.ts --coverage.thresholds.lines=80 --coverage.thresholds.statements=80 --coverage.thresholds.functions=80 --coverage.thresholds.branches=80
      - run: npm run build:prod
      - name: Linux GUI recovery
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm exec playwright test tests/e2e/electron.spec.ts --reporter=list
      - name: macOS and Windows GUI recovery
        if: matrix.platform != 'linux' && matrix.arch != 'ia32'
        run: pnpm exec playwright test tests/e2e/electron.spec.ts --reporter=list
      - name: Package unsigned macOS
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Package unsigned Windows
        if: matrix.platform == 'windows'
        run: pnpm exec electron-builder --win --${{ matrix.arch }} --publish never
      - name: Package unsigned Linux
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux --${{ matrix.arch }} --publish never
      - name: Stage final binary bytes
        run: node scripts/stage-release.cjs --platform=${{ matrix.builder_platform }} --arch=${{ matrix.arch }}
      - name: Attest final installer bytes
        id: provenance
        uses: actions/attest@v4
        with:
          subject-checksums: src/windows-client/release/public/SHA256SUMS.txt
      - name: Attach public attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: node -e "require('node:fs').copyFileSync(process.env.BUNDLE_PATH,'release/public/provenance.sigstore.json',require('node:fs').constants.COPYFILE_EXCL)"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/windows-client/release/public/*
          if-no-files-found: error
          retention-days: 14
  accept:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: windows-2022
            platform: windows
            arch: ia32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RECOVERY_SCOPE: image
      UNSIGNED_AUTHORIZED: ${{ inputs.unsigned_authorized && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/recovery
          ref: ${{ inputs.source_sha }}
          path: src
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: signed-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/candidate
      - name: Isolated installer GUI driver
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installer-playwright"
          cd "$RUNNER_TEMP/installer-playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact @playwright/test@1.63.0
          echo "INSTALLER_PLAYWRIGHT_ROOT=$RUNNER_TEMP/installer-playwright" >> "$GITHUB_ENV"
      - name: Linux installer GUI dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libgbm1 libasound2t64 xvfb
      - name: Install, verify exact final bytes and run recovery (Linux)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node packaging/verify-unsigned-release.cjs linux x64
      - name: Install, verify exact final bytes and run recovery (Mac/Windows)
        if: matrix.platform != 'linux'
        run: node packaging/verify-unsigned-release.cjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-${{ matrix.platform }}-${{ matrix.arch }}
          path: src/candidate/*
          if-no-files-found: error
          retention-days: 14
  release:
    needs: accept
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      RECOVERY_SCOPE: image
      UNSIGNED_AUTHORIZED: ${{ inputs.unsigned_authorized && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/recovery
          ref: ${{ inputs.source_sha }}
          path: src
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: accepted-*
          path: src/accepted
      - name: Enforce complete eight-package acceptance
        working-directory: src
        run: node packaging/collect-unsigned-release.cjs
      - name: Bind final acceptance, private source SHA and final checksums
        id: release_identity
        uses: actions/attest@v4
        with:
          subject-path: |
            src/unsigned-release/acceptance.json
            src/unsigned-release/SHA256SUMS.txt
      - name: Attach acceptance attestation
        working-directory: src
        env:
          BUNDLE_PATH: ${{ steps.release_identity.outputs.bundle-path }}
        run: node -e "require('node:fs').copyFileSync(process.env.BUNDLE_PATH,'unsigned-release/acceptance.sigstore.json',require('node:fs').constants.COPYFILE_EXCL)"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-${{ inputs.release_version }}-${{ inputs.source_sha }}
          path: src/unsigned-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish accepted formal release without publisher signing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        working-directory: src
        shell: bash
        run: |
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; refusing to replace published artifacts" >&2
            exit 1
          fi
          cat > formal-release-notes.md <<EOF
          百查磁盘镜像恢复 ${RELEASE_VERSION} 正式版。源码：${SOURCE_SHA}

          Windows x64/ia32；macOS 13+ Apple Silicon/Intel；Ubuntu 24.04 x64 AppImage/DEB。
          本次经用户授权暂不进行发布者签名；Windows 未签名，Mac 未完成 Developer ID 签名和 Apple 公证。下载前核对 SHA256SUMS.txt。附构建来源证明与八包最终安装、GUI、原生恢复、卸载验收记录。
          功能范围：平面 .img/.dd/.raw 磁盘镜像；NTFS/FAT/exFAT 与限定 ext4 元数据/extent 恢复。Mac/Linux 实体设备读取、JBD2 历史和 APFS 元数据恢复尚未开放。请将恢复结果保存到另一块磁盘。
          EOF
          node packaging/check-release-state.cjs
          gh release create "$TAG" unsigned-release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "百查镜像恢复 ${RELEASE_VERSION} 正式版（暂未签名）" --notes-file formal-release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          node packaging/check-release-state.cjs --after
