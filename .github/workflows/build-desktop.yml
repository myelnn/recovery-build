name: Build desktop
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character SHA in private myelnn/recovery
        required: true
        type: string
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, linux, macos, windows]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.inputs.source_sha }}-${{ github.event.inputs.platforms }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 - <<'PY'
          import json, os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_SHA']), 'Invalid source SHA'
          targets = [
            {'os':'ubuntu-24.04','platform':'linux','arch':'x64'},
            {'os':'macos-15','platform':'macos','arch':'arm64'},
            {'os':'macos-15-intel','platform':'macos','arch':'x64'},
            {'os':'windows-2022','platform':'windows','arch':'x64'},
            {'os':'windows-2022','platform':'windows','arch':'ia32'}]
          selected = os.environ['PLATFORMS']
          assert selected in ['all','linux','macos','windows'], 'Invalid platforms'
          targets = [t for t in targets if selected == 'all' or t['platform'] == selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write('include=' + json.dumps(targets) + '\n')
          PY
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/windows-client
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXT4_REQUIRE_FIXTURES: ${{ matrix.platform == 'linux' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: myelnn/recovery
          ref: ${{ inputs.source_sha }}
          path: src
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - name: Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libarchive-tools rpm libnss3 libatk-bridge2.0-0 libgtk-3-0t64 libgbm1 libasound2t64 xvfb e2fsprogs
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix native --ignore-scripts
      - run: npm run typecheck
      - name: Packaging dependency tests
        run: npm run test:packaging
      - name: Native engine
        run: node scripts/build-native.cjs --arch=${{ matrix.arch }}
      - run: npm run build:main
      - name: Independent ext4 fixtures
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          fixture_manifest=$(node scripts/create-ext4-fixtures.cjs)
          test -n "$fixture_manifest" && test -f "$fixture_manifest"
          echo "EXT4_FIXTURE_MANIFEST=$fixture_manifest" >> "$GITHUB_ENV"
      - name: Regression tests
        if: matrix.arch != 'ia32'
        run: npm test -- --reporter=dot
      - name: Ext4 parser coverage with independent fixtures
        if: matrix.platform == 'linux'
        run: pnpm exec vitest run src/main/__tests__/ext4.test.ts src/main/__tests__/ext4-production.test.ts --coverage --coverage.include=src/main/filesystems/ext4.ts --coverage.thresholds.lines=80 --coverage.thresholds.statements=80 --coverage.thresholds.functions=80 --coverage.thresholds.branches=80
      - name: Build application
        run: npm run build:prod
      - name: GUI recovery smoke on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm exec playwright test tests/e2e/electron.spec.ts --reporter=list
      - name: GUI recovery smoke on macOS and Windows
        if: matrix.platform != 'linux' && matrix.arch != 'ia32'
        run: pnpm exec playwright test tests/e2e/electron.spec.ts --reporter=list
      - name: Package macOS
        if: matrix.platform == 'macos'
        run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: pnpm exec electron-builder --linux --${{ matrix.arch }} --publish never
      - name: Package Windows
        if: matrix.platform == 'windows'
        run: pnpm exec electron-builder --win --${{ matrix.arch }} --publish never
      - name: Stage binary artifacts only
        run: node scripts/stage-release.cjs --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.source_sha }}
          path: src/windows-client/release/public/*
          if-no-files-found: error
          retention-days: 14
  release:
    needs: build
    if: inputs.platforms == 'all'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: recovery-*-${{ inputs.source_sha }}
          path: artifacts
      - name: Verify and collect installers
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil
          source = pathlib.Path('artifacts')
          output = pathlib.Path('installers'); output.mkdir()
          hashes = []
          bundles = list(source.iterdir())
          assert len(bundles) == 5, 'All five target artifacts are required'
          for bundle in bundles:
            assert bundle.is_dir() and not bundle.is_symlink()
            for line in (bundle / 'SHA256SUMS.txt').read_text().splitlines():
              digest, name = line.split('  ', 1)
              assert '/' not in name and '\\' not in name and name.endswith(('.exe','.dmg','.zip','.deb','.AppImage'))
              file = bundle / name
              assert file.is_file() and not file.is_symlink()
              assert hashlib.sha256(file.read_bytes()).hexdigest() == digest, 'Installer checksum mismatch'
              assert not (output / name).exists(), 'Duplicate installer name'
              shutil.copyfile(file, output / name); hashes.append(line)
          assert len(hashes) == 8, 'Expected two Windows, four macOS and two Linux installers'
          (output / 'SHA256SUMS.txt').write_text('\n'.join(sorted(hashes)) + '\n')
          PY
      - name: Publish image recovery beta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          TAG="image-beta-${SOURCE_SHA:0:12}"
          cat > release-notes.md <<EOF
          镜像恢复测试版。源码版本：$SOURCE_SHA

          Windows x64/ia32；macOS 13+ Apple Silicon/Intel；Linux x64 AppImage/deb。
          Mac/Linux 当前支持平面 .img/.dd/.raw 镜像，以及经验证的 ext4 extent 元数据子集；设备直接扫描、JBD2 历史和 APFS 元数据恢复尚未开放。Mac 包未签名/公证。
          安装前可核对 SHA256SUMS.txt。工作流已验证原生模块和镜像扫描、预览、恢复测试。
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --prerelease --title "跨平台镜像恢复测试版 $TAG" --notes-file release-notes.md
          fi
